<!DOCTYPE html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Karvon</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Karla:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
<a class="skip-link" href="#adm-main">Skip to content</a>

<aside class="adm-side">
  <div class="adm-brand">Karvon <span>Admin</span></div>
  <nav class="adm-nav" id="adm-nav" aria-label="Admin sections"></nav>
  <div class="adm-side__foot">
    <button class="btn btn--ghost btn--sm" type="button" id="btn-preview">Preview the site</button>
    <a class="btn btn--ghost btn--sm" href="../index.html">Back to site</a>
  </div>
</aside>

<main class="adm-main" id="adm-main">
  <div class="adm-panel"><p class="hint">Loading the current content…</p></div>
</main>

<div class="adm-bar">
  <span class="adm-bar__status" id="adm-status"><span class="dot"></span>Checking…</span>
  <button class="btn btn--ghost btn--sm" type="button" id="btn-download">Download JSON</button>
  <button class="btn btn--sm" type="button" id="btn-publish">Publish to GitHub</button>
</div>

<script src="../js/core.js"></script>
<script src="../js/github.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
